spring:
  datasource:
    url: ${FINANCIAL_DB_URL}
    password: ${FINANCIAL_DB_PASSWORD}
    username: ${FINANCIAL_DB_USERNAME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  level:
    "cn.gson.financial.kernel.model.mapper": info
  path: /data/worker/logs

mybatis-plus:
  type-aliases-package: cn.gson.financial.kernel.model.entity
  configuration:
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath:/mappers/*Mapper.xml